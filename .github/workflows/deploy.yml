name: Deploy AVR Static Website

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Rebuild every 6 hours so the copy of the Google Sheet content that is baked
  # into the site (fast first paint + search engines) never gets old.
  # Visitors always see the newest sheet content anyway - it is also fetched live.
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static website
        run: npm run build
        env:
          # Web app URL of the Google Apps Script (repo > Settings > Secrets and variables > Actions > Variables > CMS_URL)
          NEXT_PUBLIC_CMS_URL: ${{ vars.CMS_URL }}

      - name: Upload static files
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
